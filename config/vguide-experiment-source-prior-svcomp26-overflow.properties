# Ablation: source-prior mode on svcomp26-overflow-vguide (overflow)
# LLM fires before any CEGAR round using source code only (no CE context).
# Portfolio: same as svcomp26-overflow-vguide but with sourcePriorMode enabled.
#include unmaintained/svcomp26-overflow-vguide.properties

vguide.sourcePriorMode = true

# Source-prior fires exactly once; subsequent spurious rounds skip LLM.
vguide.maxLlmRoundsPerAnalysis = 1
