# Unaddressed automatic local bounds with a single constant reaching definition
# are recognized in signed-int comparisons when unchanged in the loop.
# Loops with multiple array subscripts
# are retained; pure writes to tracked cells are guarded by the tracked index.
analysis.useArrayAbstraction = true
arrayAbstraction.delegateAnalysis = predicateAnalysis.properties
report.export = false
