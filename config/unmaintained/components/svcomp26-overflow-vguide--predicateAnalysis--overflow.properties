# ----------------------------------------------------------------------
# VGuide variant of components/predicateAnalysis--overflow.properties: the same
# ABEl predicate refiner + overflow predicate setup, plus VGuide LLM predicate
# injection. Self-contained with ../../ paths because it lives one level deeper
# (unmaintained/components/). The hook (cpa.predicate.refinement.useVocabularyGuide)
# is the only behavioral change vs the official overflow predicate component.
# ----------------------------------------------------------------------

#include ../../includes/predicateAnalysis-PredAbsRefiner-ABEl.properties
#include ../../includes/predicateAnalysis--overflow.properties

# Do not skip recursion to avoid false proofs
cpa.callstack.skipVoidRecursion = false

# This is the configuration used when verifying the overflow property
overflow.config = predicateAnalysis--overflow.properties

cpa.predicate.refinement.useVocabularyGuide = true
