# ------------------------------------------------------------------------------
# VGuide variant of svcomp26--overflow.properties (v1.6 generalization experiment).
# Same overflow portfolio, but the parallel predicate child is swapped for an
# LLM-guided (VGuide) predicate analysis. Only the predicate component changes;
# the recursion/concurrency fallbacks and the spec are the official svcomp26 files.
# See docs/vguided-cegar/SVCOMP26_OVERFLOW_VGUIDE_PLAN.md.
# ------------------------------------------------------------------------------

#include ../includes/resource-limits.properties

specification = ../specification/sv-comp-overflow.spc

# CFA simplifications might remove overflows:
cfa.simplifyCfa = false
cfa.simplifyConstExpressions = false

# Expressions without live variables can contain overflows, e.g. if they contain literals!
cfa.findLiveVariables = false
overflow.useLiveness = false

# The file to which the witness is written (required by competition).
counterexample.export.graphml = witness.graphml
cpa.arg.yamlProofWitness = witness.yml
counterexample.export.yaml = witness.yml

# Compression is not supported by UltimateAutomizer
counterexample.export.compressWitness = false
cpa.arg.compressWitness = false

# Use sequential combination of analyses.
analysis.restartAfterUnknown = true

# The analyses used for overflow properties. Only the first (parallel) entry is
# swapped for the VGuide variant; recursion/concurrency fallbacks stay official.
restartAlgorithm.configFiles = components/svcomp26-overflow-vguide--parallel-overflow.properties, \
                               ../predicateAnalysis-bam-rec--overflow.properties::if-recursive, \
                               components/svcomp26--concurrency-overflow.properties::if-concurrent

# self-reference to allow direct usage
overflow.config = svcomp26-overflow-vguide.properties

# malloc never returns null according to SV-Comp rules
cpa.predicate.memoryAllocationsAlwaysSucceed = true

cfa.useCFACloningForMultiThreadedPrograms=true
