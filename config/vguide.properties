# Unified VGuide (use with cpa.predicate.refinement.useVocabularyGuide=true)
# LLM provider: deepseek (default) or meta; override with VGUIDE_LLM_PROVIDER env.
# LLM model: DeepSeek defaults to deepseek-v4-pro; Meta defaults to muse-spark-1.2-contributor.
# Override with VGUIDE_LLM_MODEL (DEEPSEEK_MODEL remains compatible).
# Meta uses its minimum reasoning_effort=minimal by default; see llm/LLM_API.md.
vguide.enable = true
vguide.wallBudgetSec = 0

# Hard cap on spurious rounds that invoke LLM (0 = disable). Each round may fire multiple API
# draws when llmSamplesPerCall>1; maxLlmRounds counts rounds, not HTTP requests.
# When to call LLM on spurious CE:
#   first_spurious  - only refinement #1 (lowest cost; fires even when stock would converge fast)
#   every_n         - #1, then every N spurious refinements (#1+N, #1+2N, …)
#   min_interval    - #1, then only if llmMinIntervalSec elapsed since last call
#   every_n_and_interval - both conditions
#   every_n_or_interval  - fire on EITHER the every-N trigger (first at #N, never #1) OR the
#                          wall-clock trigger (first call waits llmMinIntervalSec from analysis
#                          start, then from previous call). Default: only intervene when stock is
#                          not converging — by refinement count (many cheap refinements) or by
#                          wall-clock (few expensive refinements). See REACHSAFETY_IMPROVEMENT_PLAN.md A1.
# 排程推導見 docs/vguided-cegar/LLM_CALL_SCHEDULING.md (LLM p50~1s, batch avg~1.65s)
# Default: first_spurious — fire LLM at the FIRST spurious refinement (original design,
# issue #57). every_n_or_interval (K=10/D=15s, stock-first guard) was a later deviation
# that starved early refinement help: 68/224 tasks with refinements got 0 LLM rounds.
vguide.llmCallSchedule = first_spurious
vguide.llmEveryNSpuriousRefinements = 10
vguide.llmMinIntervalSec = 15
vguide.maxLlmRoundsPerAnalysis = 5
# Peel trigger (v1.7.1): also fire early (refinement #2+) when the CE passes loop heads >= 4 times
# (stock is unrolling a loop). Calibrated: converging tasks (nested-3) peak at 3 → never fire;
# diverging tasks cross 4 at refinement #2-4 → fire far earlier than the #10 / 15s triggers.
vguide.peelLoopHeadThreshold = 4

# Ensemble: K = SAFE draws per LLM round. BUG_HUNT is long-term research only (#121).
# 1 sync + (K-1) parallel extras. Default K=1.
vguide.dualPromptMode = false
vguide.llmSamplesPerCall = 1
vguide.llmSampleParallelism = 4

# Single-draw predicate budget. The minimum is retained as legacy run metadata;
# only the maximum is prompt guidance and a post-parse cap.
vguide.minPredicatesPerCall = 8
vguide.maxPredicatesPerCall = 12

vguide.frozenDir = docs/vguided-cegar/predicate_sets
vguide.allowInterpolantStrengthen = true

# Default off: experiments show better PAR-2 / solved count without L3 on full_scalar.
# Enable per run: --option vguide.enableL3Entailment=true  or  run.sh cpa --ablation l3
vguide.enableL3Entailment = false
